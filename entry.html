<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5"><title>Stock entry</title></head><body>
<header class="top"><a class="back" href="index.html" aria-label="Back to home">‹</a><h1 id="title">Production entry</h1><button class="chip" id="user"></button></header>
<main hidden>
<div class="card"><h2>Select SKU</h2><div id="picker"></div></div>
<div class="card" id="form" hidden>
  <div class="sel" id="sel"></div>
  <label>Current stock</label><div id="stk"></div>
  <div id="srcBox" hidden>
    <label>Stock coming from</label>
    <div class="seg" id="src"><button data-v="PROD" class="on">Production</button><button data-v="DIRECT">Direct ready stock</button></div>
    <p class="hint" id="srcHint"></p>
  </div>
  <label id="qtyLbl">Size-wise qty to add</label>
  <div class="tags" id="grid"></div>
  <div class="total"><span>Total</span><span id="tot">0 pcs</span></div>
  <div class="row">
    <div><label for="date">Date</label><input id="date" type="date"></div>
    <div><label for="ref">Lot / order ref</label><input id="ref"></div>
  </div>
  <label for="notes">Notes</label><input id="notes">
  <label class="checkline" id="closeBox" hidden><input type="checkbox" id="close">
    <span>Production completed for this colour. Balance in-production qty becomes short / rejection.</span></label>
  <button class="btn" id="save">Save</button>
</div>
<div class="card"><h2 id="recTitle">Last 10 entries</h2><div id="recent" class="hint">Loading…</div></div>
</main>
<dialog id="ed"><div class="edbox">
  <div class="edhead"><b id="eTitle">Edit entry</b><button class="x" id="eClose" aria-label="Close">×</button></div>
  <div class="sel" id="eSel" style="margin-top:10px"></div>
  <label>Size-wise qty</label><div class="tags" id="eGrid"></div>
  <div class="total"><span>Total</span><span id="eTot">0 pcs</span></div>
  <div class="row">
    <div><label for="eDate">Date</label><input id="eDate" type="date"></div>
    <div><label for="eRef">Lot / order ref</label><input id="eRef"></div>
  </div>
  <label for="eNotes">Notes</label><input id="eNotes">
  <p class="err" id="eErr" role="alert"></p>
  <button class="btn" id="eSave">Save changes</button>
  <button class="btn ghost" id="eDel" style="color:var(--red);border-color:var(--red);margin-top:10px">Delete entry</button>
</div></dialog>
<script src="config.js?v=5"></script><script src="app.js?v=5"></script>
<script>
const MODE = new URLSearchParams(location.search).get('m') === 'ready' ? 'ready' : 'prod';
const T = MODE === 'ready'
  ? { title:'Ready inward', btn:'Move to ready', types:['READY_IN','READY_DIRECT','PROD_SHORT'] }
  : { title:'Production entry', btn:'Add to production', types:['PROD_IN'] };
const LBL = { PROD_IN:'In production', READY_IN:'Ready', READY_DIRECT:'Direct ready', PROD_SHORT:'Short' };
const CLS = { PROD_IN:'b-prod', READY_IN:'b-ready', READY_DIRECT:'b-ready', PROD_SHORT:'b-short' };
let SKUS = [], CUR = null, SRC = 'PROD';
document.title = T.title; $('#title').textContent = T.title; $('#save').textContent = T.btn;
document.body.classList.add('m-' + MODE);
$('#date').value = today();

async function loadSkus(keep) {
  SKUS = (await api('skuList')).skus;
  skuPicker($('#picker'), SKUS, pick);
  if (keep) { const p = SKUS.find(x => x.parent === keep); if (p) pick(p, false); }
}
function pick(p, scroll) {
  CUR = p; $('#form').hidden = false;
  $('#sel').innerHTML = `${thumb(p.image)}<div><b>${esc(p.name)}</b><div class="hint">${esc(p.product)} ${esc(p.style)} | ${esc(p.parent)}</div></div>`;
  $('#srcBox').hidden = MODE !== 'ready';
  drawGrid(); loadRecent();
  if (scroll) $('#form').scrollIntoView({ behavior:'smooth', block:'start' });
}
function drawGrid() {
  const fromProd = MODE === 'ready' && SRC === 'PROD';
  $('#grid').innerHTML = CUR.sizes.map(s => `<div class="tag"><b>${esc(s.size)}</b>
    <input type="number" inputmode="numeric" min="0" style="margin-top:6px" ${fromProd ? 'max="' + s.inProd + '"' : ''} data-sku="${esc(s.sku)}" aria-label="${esc(s.size)} qty"></div>`).join('');
  $('#stk').innerHTML = stockTable(CUR.sizes);
  $('#qtyLbl').textContent = MODE === 'ready' ? (fromProd ? 'Size-wise packed qty (moves from In production)' : 'Size-wise qty to add to Ready') : 'Size-wise qty to add to production';
  $('#closeBox').hidden = !fromProd;
  $('#srcHint').textContent = MODE !== 'ready' ? ''
    : fromProd ? 'Qty moves from In production to Ready.' : 'Old or extra stock not entered in production. Adds straight to Ready.';
  sumUp();
}
function lines() { return [...document.querySelectorAll('#grid input')].map(i => ({ sku: i.dataset.sku, qty: Math.round(Number(i.value) || 0) })).filter(l => l.qty > 0); }
function sumUp() { $('#tot').textContent = lines().reduce((a, l) => a + l.qty, 0) + ' pcs'; }

let REC = [], EE = null;
async function loadRecent() {
  try {
    const r = await api('recent', { types: T.types, parent: CUR ? CUR.parent : '' });
    REC = r.rows;
    $('#recTitle').textContent = CUR ? 'Entries for ' + CUR.name + ' (' + CUR.parent + ')' : 'Last 10 entries';
    const ed = can('ENTRY_EDIT');
    $('#recent').innerHTML = REC.length ? REC.map((x, i) => `<div class="rec" style="display:flex;gap:10px;align-items:flex-start">
      <div style="flex:1"><b>${esc(x.parent)}</b> <span class="${CLS[x.type]}">${LBL[x.type]} ${x.qty} pcs</span>
      <div class="hint">${esc(x.date)} | ${esc(x.parts.join(', '))} | ${esc(x.by)}${x.ref ? ' | ' + esc(x.ref) : ''}${x.notes ? ' | ' + esc(x.notes) : ''}</div></div>
      ${ed ? `<button class="ebtn" data-i="${i}">Edit</button>` : ''}</div>`).join('')
      : 'No entries yet.';
  } catch (e) { $('#recent').textContent = e.message; }
}
function openEntry(i) {
  EE = REC[i]; if (!EE) return;
  const sku = SKUS.find(p => p.parent === EE.parent);
  const sizes = sku ? sku.sizes.map(s => ({ sku: s.sku, size: s.size })) : [];
  EE.lines.forEach(l => { if (!sizes.some(s => s.sku === l.sku)) sizes.push({ sku: l.sku, size: l.size }); });
  $('#eTitle').textContent = 'Edit ' + LBL[EE.type] + ' entry';
  $('#eSel').innerHTML = sku ? `${thumb(sku.image)}<div><b>${esc(sku.name)}</b><div class="hint">${esc(EE.parent)} | ${esc(EE.id)}</div></div>`
    : `<div><b>${esc(EE.parent)}</b><div class="hint">${esc(EE.id)}</div></div>`;
  $('#eGrid').innerHTML = sizes.map(s => { const l = EE.lines.find(x => x.sku === s.sku);
    return `<div class="tag"><b>${esc(s.size)}</b><input type="number" inputmode="numeric" min="0" data-sku="${esc(s.sku)}"
      value="${l ? l.qty : ''}" aria-label="${esc(s.size)} qty" style="margin-top:6px"></div>`; }).join('');
  $('#eDate').value = EE.date; $('#eRef').value = EE.ref || '';
  $('#eNotes').value = String(EE.notes || '').replace(/\s*\[edited by [^\]]*\]/g, '');
  $('#eErr').textContent = ''; eSum(); $('#ed').showModal();
}
const eLines = () => [...document.querySelectorAll('#eGrid input')].map(i => ({ sku: i.dataset.sku, qty: Math.round(Number(i.value) || 0) })).filter(l => l.qty > 0);
function eSum() { $('#eTot').textContent = eLines().reduce((a, l) => a + l.qty, 0) + ' pcs'; }
async function saveEntry(del) {
  $('#eErr').textContent = '';
  if (del && !confirm('Delete this ' + LBL[EE.type] + ' entry of ' + EE.qty + ' pcs? This cannot be undone.')) return;
  const b = del ? $('#eDel') : $('#eSave'), t = b.textContent; b.disabled = true; b.textContent = 'Saving…';
  try {
    await api('editEntry', { id: EE.id, type: EE.type, del, date: $('#eDate').value, ref: $('#eRef').value, notes: $('#eNotes').value, lines: eLines() });
    $('#ed').close(); toast(del ? 'Entry deleted' : 'Entry updated');
    await loadSkus(CUR ? CUR.parent : ''); loadRecent();
  } catch (e) { $('#eErr').textContent = e.message; }
  b.disabled = false; b.textContent = t;
}
$('#recent').onclick = e => { const b = e.target.closest('.ebtn'); if (b) openEntry(Number(b.dataset.i)); };
$('#eGrid').oninput = eSum;
$('#eClose').onclick = () => $('#ed').close();
$('#eSave').onclick = () => saveEntry(false);
$('#eDel').onclick = () => saveEntry(true);

$('#src').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  SRC = b.dataset.v; [...$('#src').children].forEach(x => x.classList.toggle('on', x === b)); drawGrid();
};
$('#grid').oninput = sumUp;
$('#save').onclick = async () => {
  const L = lines(), close = MODE === 'ready' && SRC === 'PROD' && $('#close').checked;
  if (!L.length && !close) return toast('Enter qty for at least one size', 1);
  if (close) {
    const left = CUR.sizes.reduce((a, s) => { const l = L.find(x => x.sku === s.sku); return a + Math.max(0, s.inProd - (l ? l.qty : 0)); }, 0);
    if (left > 0 && !confirm(left + ' pcs still in production will be marked short / rejection. Continue?')) return;
  }
  const b = $('#save'); b.disabled = true; b.textContent = 'Saving…';
  try {
    await api('stockEntry', { type: MODE === 'ready' ? 'READY_IN' : 'PROD_IN', source: SRC, parent: CUR.parent,
      date: $('#date').value, ref: $('#ref').value, notes: $('#notes').value, lines: L, closeProduction: close });
    toast('Saved ' + L.reduce((a, l) => a + l.qty, 0) + ' pcs for ' + CUR.parent);
    $('#notes').value = ''; $('#close').checked = false;
    await loadSkus(CUR.parent);
  } catch (e) { toast(e.message, 1); }
  b.disabled = false; b.textContent = T.btn;
};

gate([MODE === 'ready' ? 'READY_ENTRY' : 'PROD_ENTRY'], async () => {
  try { await loadSkus(); } catch (e) { toast(e.message, 1); }
  loadRecent();
});
</script></body></html>
